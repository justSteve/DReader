# gitleaks — the factory gate for this repo. Credential estate convention
# 2026-08-25 (Steve to COO), point 5: a secret value cannot land in-tree.
# Extends the default rule set. Allowlists name KNOWN NON-SECRETS only — never a
# real value; a real value that trips the gate gets moved to /home/vault/DReader,
# not allowlisted. Installed 2026-09-07 by COO's estate review [co-9g1lx];
# the hook that runs it is .beads/hooks/pre-commit (core.hooksPath).
title = "gitleaks gate"

[extend]
useDefault = true

[[allowlists]]
description = "third-party and generated trees, virtual environments, working data"
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)node_modules/''',
  '''(^|/)__pycache__/''',
  '''(^|/)dist/''',
  '''(^|/)data/''',
  '''^yt-analyst/videos/[^/]+/runs/''',
  '''^yt-analyst/browser\.html$''',
]
